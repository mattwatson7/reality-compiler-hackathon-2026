[project]
name = "reality-compiler"
version = "0.1.0"
description = "Evidence-backed physical procedure verification (fixture milestone)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "python-multipart>=0.0.20,<1",
  "opencv-python-headless>=4.11,<5", "imageio-ffmpeg>=0.6,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "scripts"]
ignore_missing_imports = true
