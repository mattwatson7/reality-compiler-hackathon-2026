services:
  reality-compiler:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROVIDER_MODE: fixture
      MEDIA_TTL_SECONDS: "3600"
      MAX_UPLOAD_MB: "100"
      MAX_VIDEO_SECONDS: "300"
    volumes:
      - reality-data:/app/data
    init: true
volumes:
  reality-data:
